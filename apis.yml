aid: ccxt

name: CCXT

image: https://docs.ccxt.com/og/home

description: 'CCXT is an open-source (MIT) cryptocurrency trading library that wraps the public and private
  APIs of 100+ crypto exchanges and prediction markets behind one unified API, in JavaScript/TypeScript,
  Python, PHP, C#, Go, Java and Rust (npm ccxt 4.5.85). It is a client library, not a hosted HTTP API:
  there is no CCXT server endpoint and no OpenAPI. It also ships a local stdio MCP server (npm ccxt-mcp),
  a CLI, and AI coding skills.'

